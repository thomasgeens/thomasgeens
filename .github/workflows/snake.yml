name: Generate contribution snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colors themed to https://thomas.geens.be
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=00d9ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00d9ff&color_dots=#151a35,#2a3566,#4f5aa8,#667eea,#764ba2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
